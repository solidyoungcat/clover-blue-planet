name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:web

      # 上传 Web 产物
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist/

  release:
    runs-on: ubuntu-latest
    needs: build-web
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "四叶草蓝星球 ${{ github.ref_name }}"
          body: |
            ## 🍀 四叶草蓝星球 ${{ github.ref_name }}

            ### 🌐 网页版
            部署 Web 端即可使用。下载 `web-dist.zip` 解压后托管到任意静态服务器。

            ### 🖥 桌面端
            桌面端请在本地构建：
            ```bash
            pnpm install
            pnpm --filter desktop build
            ```
            安装包在 `packages/desktop/release/` 目录。
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
